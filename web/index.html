<title>Angle Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an editing bay. Sticky model bar on top, the pipeline rail on the left, one working surface per step, approval bar at the foot of each step. */
:root {
  --bg: #E8EBEF; --surface: #FFFFFF; --sunk: #F2F4F7; --ink: #131820; --muted: #59636F; --line: #D3D8DF;
  --accent: #1D53CC; --accent-soft: #E2EAFA; --on-accent: #FFFFFF;
  --rec: #D23F29; --ok: #1B7A51; --ok-soft: #DCEFE5; --warn: #8E6210; --warn-soft: #F6EAD0; --fail: #B23131; --fail-soft: #F7DFDF;
  --frame: #0A0D12; --cap: #FFE45C;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A21; --sunk: #1C212A; --ink: #E7EAF0; --muted: #98A2B1; --line: #2A313C;
  --accent: #7097FF; --accent-soft: #1D2A47; --on-accent: #0B1020;
  --rec: #FF6A52; --ok: #45C48C; --ok-soft: #15302A; --warn: #E2AA48; --warn-soft: #352A15; --fail: #F06C6C; --fail-soft: #3A1E1E;
  --frame: #05070A; --cap: #FFE45C; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --sunk: #1C212A; --ink: #E7EAF0; --muted: #98A2B1; --line: #2A313C;
  --accent: #7097FF; --accent-soft: #1D2A47; --on-accent: #0B1020;
  --rec: #FF6A52; --ok: #45C48C; --ok-soft: #15302A; --warn: #E2AA48; --warn-soft: #352A15; --fail: #F06C6C; --fail-soft: #3A1E1E;
  --frame: #05070A; --cap: #FFE45C; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* Buttons and controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--sunk); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--fail); }
.btn .tag { font-family: var(--f-mono); font-size: 12px; opacity: 0.85; }
.btn svg { width: 15px; height: 15px; flex: none; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; }
.textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; }
.chip.btnchip { cursor: pointer; }
.chip.btnchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ready { color: var(--ok); background: var(--ok-soft); }
.pill.generating { color: var(--rec); background: var(--fail-soft); }
.pill.generating::before { animation: blink 1s infinite; }
.pill.failed { color: var(--fail); background: var(--fail-soft); }
.pill.pending { color: var(--muted); background: var(--sunk); }
@keyframes blink { 50% { opacity: 0.2; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); top: 5px; right: 5px; }
.brand-mark::before { content: ""; position: absolute; left: 5px; bottom: 5px; width: 12px; height: 8px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: skewX(-20deg); }
.proj-title { color: var(--muted); font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.models { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; align-items: center; }
.picker { position: relative; }
.picker > button { display: flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r-sm); padding: 4px 10px 5px; cursor: pointer; min-width: 132px; text-align: left; }
.picker > button:hover { border-color: var(--muted); }
.picker .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.picker .v { font-weight: 500; font-size: 13px; white-space: nowrap; }
.picker .v small { font-family: var(--f-mono); color: var(--muted); font-size: 11px; margin-left: 6px; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 32px rgba(0,0,0,0.18); width: min(340px, calc(100vw - 32px)); padding: 6px; }
.menu-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
.menu-item:hover:not(:disabled) { background: var(--sunk); }
.menu-item[aria-checked="true"] { background: var(--accent-soft); }
.menu-item:disabled { opacity: 0.55; cursor: not-allowed; }
.menu-item .mi-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.menu-item .mi-sub { font-size: 12px; color: var(--muted); }
.menu-note { font-size: 12px; color: var(--muted); padding: 6px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
.costpill { font-family: var(--f-mono); font-size: 12px; padding: 5px 10px; border-radius: var(--r-sm); background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; }
.costpill b { font-weight: 500; color: var(--ink); }
.saved { font-size: 12px; color: var(--ok); display: inline-flex; align-items: center; gap: 4px; }

/* Shell */
.shell { flex: 1; display: grid; grid-template-columns: 218px minmax(0, 1fr); gap: 20px; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; width: 100%; margin: 0 auto; }
.rail { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 18px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail-item { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; text-align: left; width: 100%; color: var(--ink); }
.rail-item:hover:not(:disabled) { background: var(--surface); }
.rail-item[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.rail-item:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.7; }
.rail-num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.rail-item.done .rail-num { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.rail-item[aria-current="true"] .rail-num { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rail-item.skipped { color: var(--muted); }
.rail-item.skipped .rail-label { text-decoration: line-through; }
.rail-item .rail-meta { margin-left: auto; font-size: 11px; color: var(--muted); }
.rail-item svg { width: 15px; height: 15px; }
.rail-count { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* Panels and step header */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.stephead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.stephead p { color: var(--muted); max-width: 62ch; margin-top: 4px; }
.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); padding: 10px 14px; border-radius: var(--r); font-size: 13px; }
.banner b { color: var(--accent); }
.note { font-size: 13px; color: var(--muted); }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; }
.okbox { background: var(--ok-soft); color: var(--ok); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; }

/* Approval bar */
.approve { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,0.22); }
.approve .cp { font-size: 13px; display: flex; gap: 8px; align-items: center; }
.approve .cp b { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 18%, transparent); }
.approve .btn { border-color: color-mix(in srgb, var(--bg) 30%, transparent); background: transparent; color: var(--bg); }
.approve .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.approve .gate { color: var(--ink); }
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
.gate table { width: 100%; border-collapse: collapse; font-size: 13px; }
.gate td { padding: 2px 0; }
.gate td:last-child { text-align: right; font-family: var(--f-mono); }
.gate .tot td { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }

/* Ingest */
.ingest-hero { display: grid; gap: 16px; padding: 28px; }
.urlrow { display: flex; gap: 8px; flex-wrap: wrap; }
.urlrow .input { flex: 1 1 280px; font-family: var(--f-mono); font-size: 13px; padding: 11px 12px; }
.stages { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.stage { display: flex; gap: 8px; align-items: center; }
.stage .dot { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); }
.stage.done { color: var(--ok); }
.stage.now { color: var(--rec); font-weight: 600; }
.stage.todo { color: var(--muted); }

/* Angles */
.angles-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.source-card { display: grid; grid-template-columns: 76px 1fr; gap: 12px; }
.thumb { border-radius: var(--r-sm); overflow: hidden; background: var(--frame); aspect-ratio: 16/9; position: relative; }
.thumb svg, .frame svg, .art svg { display: block; width: 100%; height: 100%; }
.keyframes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.keyframes figure { margin: 0; }
.keyframes figcaption { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.beats { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.beats li { display: grid; grid-template-columns: 38px 1fr; gap: 6px; }
.beats .mono { color: var(--muted); font-size: 12px; }
.gaps { display: flex; flex-direction: column; gap: 6px; }
.gap { font-size: 13px; padding: 6px 8px; border-radius: var(--r-sm); background: var(--sunk); }
.gap .eyebrow { font-size: 10px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.acard.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.acard-top { display: flex; gap: 12px; align-items: flex-start; }
.score { flex: none; width: 46px; height: 46px; position: relative; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.score svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.acard h3 { font-size: 15.5px; line-height: 1.25; }
.acard .pitch { font-size: 13px; color: var(--muted); }
.why { font-size: 13px; border-left: 2px solid var(--accent); padding-left: 8px; }
.hookq { font-size: 13px; font-style: italic; background: var(--sunk); padding: 6px 9px; border-radius: var(--r-sm); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.swatches { display: inline-flex; }
.swatches i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: -3px; border: 1px solid var(--surface); }
.origin { font-size: 12px; color: var(--muted); display: flex; gap: 6px; }
.origin q { font-style: italic; }
.acard-actions { display: flex; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 4px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.meta-d summary { cursor: pointer; font-size: 12px; color: var(--accent); font-weight: 500; }
details.meta-d[open] summary { margin-bottom: 6px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tray { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

/* Script */
.hooks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.hookopt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; font-size: 13.5px; display: flex; gap: 8px; }
.hookopt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hookopt .radio, .chcard .radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 3px; }
.hookopt[aria-pressed="true"] .radio, .chcard[aria-pressed="true"] .radio { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: 30px minmax(0, 1fr) 64px 32px; gap: 8px; align-items: start; }
.line.char { grid-template-columns: 30px 130px minmax(0, 1fr) 64px 32px; }
.line .idx { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 9px; text-align: right; }
.line .secs { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 9px; text-align: right; }
.line .textarea { min-height: 40px; }
.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; position: relative; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.meter.warn > i { background: var(--warn); }
.meter.bad > i { background: var(--fail); }
.textarea.story { font-size: 15px; line-height: 1.65; min-height: 320px; }
.script-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }

/* Style */
.tgal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.tcard { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); overflow: hidden; padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; min-width: 0; position: relative; }
.tcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tcard:disabled { cursor: not-allowed; }
.tmain { aspect-ratio: 1; overflow: hidden; background: var(--sunk); }
.tmain img, .tthumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tmain img { transition: transform .35s ease; }
.tcard:hover .tmain img { transform: scale(1.04); }
.tthumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--line); }
.tthumbs span { aspect-ratio: 1; overflow: hidden; background: var(--sunk); display: block; }
.tbody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.tbody .note { font-size: 12px; }
.tcheck { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.tcheck svg { width: 14px; height: 14px; }
.tdetail { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; align-items: start; }
.tdetail img { width: 100%; border-radius: var(--r-sm); display: block; aspect-ratio: 1; object-fit: cover; }
.upl { display: flex; gap: 8px; flex-wrap: wrap; }
.upl img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); }
.caplist { display: flex; flex-direction: column; gap: 4px; max-height: 380px; overflow: auto; padding-right: 4px; }
.capline { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; align-items: start; }
.capline .textarea { min-height: 34px; padding: 6px 8px; font-size: 13px; }
.capline .idx { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 8px; text-align: right; }
.kthumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.kthumb { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.kthumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chkit summary { cursor: pointer; list-style: revert; }
.chcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.chcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: flex; gap: 8px; font: inherit; color: inherit; }
.chcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chdetail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }

      // A few at a time, so the provider is not flooded; stop early if the key is out of quota.
      const queue = ids.slice();
      // Locked look: make the first scene alone, so it can guide every other scene.
      if (STATE.projects[pid].style_lock !== false && !lookAnchor(STATE.projects[pid], null) && queue.length > 1) await api.generateImage(pid, queue.shift());
      const workers = Array.from({ length: Math.min(3, queue.length) }, async () => {
        while (queue.length) {
          const id = queue.shift(); await api.generateImage(pid, id);
          const sc = STATE.projects[pid].scenes.find(x => x.id === id);
          if (sc && sc.image_status === 'failed' && /quota|billing|free tier|refused/i.test(sc.error || '')) { queue.length = 0; toast(sc.error); }
        }
      });
      await Promise.all(workers); return;
    }
    await Promise.all(ids.map((id, i) => sleep(i * 120).then(() => api.generateImage(pid, id))));
  },
  async generateImage(pid, sceneId, noFail) {
    updateP(pid, p => { const x = p.scenes.find(x => x.id === sceneId); if (x && x.reuse_of) x.reuse_of = null; });
    if (LIVE) {
      const p0 = STATE.projects[pid]; const sc0 = p0.scenes.find(x => x.id === sceneId); if (!sc0) return;
      updateP(pid, p => { const x = p.scenes.find(x => x.id === sceneId); if (x) { x.image_status = 'generating'; x.error = null; } });
      const chars = p0.characters.filter(c => sc0.character_ids.includes(c.id)).map(c => c.name + ', ' + c.description).join('; ');
      const st = styleById(p0.style);
      const prompt = imagePrompt(st, (sc0.image_prompt || sc0.description) + (chars ? '. Characters: ' + chars : ''));
      const anchor = lookAnchor(p0, sceneId);
      const refs = (st.refs || []).concat(anchor ? [anchor] : []);
      try {
        const r = await post('image', { prompt, aspect: p0.format.aspect_ratio, model: p0.models.image, refs });
        updateP(pid, p => { const x = p.scenes.find(x => x.id === sceneId); if (!x) return; x.image_versions.push({ url: r.url, prompt, model: p.models.image, style: p.style, at: Date.now() }); x.image_index = x.image_versions.length - 1; x.image_status = 'ready'; addCost(p, r.cost || 0); });
      } catch (e) { updateP(pid, p => { const x = p.scenes.find(x => x.id === sceneId); if (x) { x.image_status = 'failed'; x.error = e.message; } }); }
      return;
    }
    updateP(pid, p => { const s = p.scenes.find(s => s.id === sceneId); if (s) s.image_status = 'generating'; });
    await sleep(1100 + Math.random() * 1700);
    const fail = !noFail && Math.random() < 0.08;
    updateP(pid, p => {
      const s = p.scenes.find(s => s.id === sceneId); if (!s) return;
      if (fail) { s.image_status = 'failed'; s.error = 'Provider timed out after 60 s. Retry usually works.'; return; }
      s.image_versions.push({ seed: randSeed(), prompt: s.image_prompt, model: p.models.image, style: p.style, at: Date.now() });
      s.image_index = s.image_versions.length - 1; s.image_status = 'ready'; s.error = null;
      addCost(p, modelOf(p, 'image').cost);
    });
  },
  async animate(pid, sceneIds) {
    updateP(pid, p => p.scenes.forEach(s => { if (sceneIds.includes(s.id)) s.clip_status = 'generating'; }));
    await Promise.all(sceneIds.map((id, i) => sleep(i * 300 + 1500 + Math.random() * 2000).then(() => updateP(pid, p => {
      const s = p.scenes.find(s => s.id === id); if (!s) return;
      const m = modelOf(p, 'video'); const need = sceneSecs(p, s); const gen = Math.min(m.maxClip, Math.ceil(need / 5) * 5);
      s.clip_versions.push({ seed: randSeed(), motion: s.motion_prompt, model: m.id, generated: gen, fitted: need, at: Date.now() });
      s.clip_index = s.clip_versions.length - 1; s.clip_status = 'ready';
      addCost(p, gen * m.cost);
    }))));
  },
  async buildDraft(pid) {
    if (LIVE) return liveRender(pid, false);
    updateP(pid, p => { p.rendering = 'draft'; });
    await runJob(pid, 'Building 480p draft', ['Placing scenes on the timeline', 'Adding zoom and pan', 'Timing captions to the narration', 'Encoding 480p draft'], 600);
    updateP(pid, p => { p.rendering = null; p.render.draft_path = 'projects/' + p.id + '/draft_480p.mp4'; });
    toast('Draft ready. Play it before rendering the final file.');
  },
  async renderFinal(pid) {
    if (LIVE) return liveRender(pid, true);
    updateP(pid, p => { p.rendering = 'final'; });
    await runJob(pid, 'Rendering final MP4', ['Mixing voice and music', 'Ducking music under the voice', 'Burning in captions', 'Normalizing loudness to −14 LUFS', 'Checking caption safe areas', 'Encoding 1080p H.264'], 700);
    updateP(pid, p => { p.rendering = null; p.status = 'rendered'; p.render.final_path = 'projects/' + p.id + '/final_1080p.mp4'; p.step = 'export'; });
    toast('Final video rendered.');
  },
};

/* ======================================================================
   Pipeline steps and checkpoints (PRJ-2)
   ====================================================================== */
const STEPS = [
  { id: 'ingest', label: 'Start' }, { id: 'angles', label: 'Pick angle', cp: 'angles' },
  { id: 'script', label: 'Script', cp: 'script' }, { id: 'style', label: 'Visual style', cp: 'style' },
  { id: 'scenes', label: 'Scenes & images', cp: 'scenes' }, { id: 'voice', label: 'Voice', cp: 'voice' },
  { id: 'format', label: 'Format', cp: 'format' }, { id: 'animate', label: 'Animate', cp: 'clips' },
  { id: 'compile', label: 'Compile' }, { id: 'export', label: 'Export' },
];
const isOwn = p => p.start_mode === 'idea' || p.start_mode === 'paste';
function isSkipped(p, id) { return (id === 'animate' && p.checkpoints.format && !needsAnimate(p)) || (id === 'angles' && isOwn(p)); }
function isDone(p, id) {
  if (id === 'ingest') return !!p.analysis;
  if (id === 'compile') return !!p.render.final_path;
  if (id === 'export') return false;
  const st = STEPS.find(s => s.id === id); return !!p.checkpoints[st.cp];
}
function isUnlocked(p, id) {
  for (const st of STEPS) { if (st.id === id) return true; if (!isSkipped(p, st.id) && !isDone(p, st.id)) return false; }
  return true;
}
function nextStep(p, id) {
  const i = STEPS.findIndex(s => s.id === id);
  for (let j = i + 1; j < STEPS.length; j++) if (!isSkipped(p, STEPS[j].id)) return STEPS[j].id;
  return id;
}
function goStep(id) { update(s => { s.view = 'flow'; s.projects[s.currentId].step = id; }); try { window.scrollTo({ top: 0 }); } catch (e) {} }
function approve(pid, stepId) {
  updateP(pid, p => { const st = STEPS.find(s => s.id === stepId); p.checkpoints[st.cp] = true; p.step = nextStep(p, stepId); });
  try { window.scrollTo({ top: 0 }); } catch (e) {}
}
// Editing an approved step reopens it and every later checkpoint, but keeps their work for re-approval.
function reopen(pid, stepId) {
  updateP(pid, p => {
    const i = STEPS.findIndex(s => s.id === stepId);
    STEPS.slice(i).forEach(st => { if (st.cp) p.checkpoints[st.cp] = false; });
    p.render.draft_path = null; p.render.final_path = null; p.status = 'draft'; p.step = stepId;
  });
}

}

function ScriptScreen({ p, s }) {

  if (!sc || sc.generating) return html`<${Fragment}><${StepHead} title="Writing the story" sub="Drafting three hook options and a story that fits your target length." /><div className="panel stack">${[90, 70, 85, 60, 75].map((w, i) => html`<div key=${i} className="skeleton" style=${{ width: w + '%' }}></div>`)}</div></${Fragment}>`;
  const isChar = p.video_type === 'character';
  const lines = linesOf(p); const total = lines.reduce((n, l) => n + lineSecs(p, l), 0); const target = p.format.target_seconds;
  const ovPct = p.source.transcript ? Math.round(overlap(sc.story, p.source.transcript) * 100) : 0;
  const pasted = !!sc.pasted;
  const sep = isChar ? '\n' : '\n\n';
  const setTarget = v => updateP(p.id, q => { q.format.target_seconds = v; });
  const pickHook = i => updateP(p.id, q => {
    const parts = q.script.story.split(sep); const m = isChar && parts[0].match(/^([^:]{1,24}:\s*)/);
    parts[0] = (m ? m[1] : '') + q.script.hook_options[i]; q.script.story = parts.join(sep); q.script.chosen_hook = i;
  });
  const onApprove = () => {
    updateP(p.id, q => {
      const old = q.script.lines || []; const used = new Set();
      q.script.lines = storyLines(q).map(l => {
        const o = old.find(x => !used.has(x.id) && x.text === l.text && x.speaker === l.speaker);
        if (o) { used.add(o.id); return { ...o, visual: l.visual || o.visual }; }
        return { ...l, id: uid('ln'), audio_status: 'pending', duration: null };
      });
    });
    approve(p.id, 'script');
  };
  const tpl = s.templates[0];
  return html`<${Fragment}>
    <${StepHead} title="Story script" sub=${(sc.pasted ? 'Your own story, used word for word.' : 'One story, written by ' + (sc.written_by || modelOf(p, 'writer').name) + '.') + ' Edit it freely. Next it is split into scenes and each scene gets an image.'}>

      </div>
      ${pasted ? html`<button type="button" className="btn" disabled=${locked || sc.revising} title="The writer shortens or lengthens your story to the target and keeps what it says" onClick=${() => api.reviseStory(p.id, 'Do not add new content. Only shorten or lengthen the story so it fits the target length, keeping its events, order, names and voice.')}><${Icon} n="redo" />Fit my story to ${lenLabel(target)}</button>` : html`<button type="button" className="btn" disabled=${locked} onClick=${() => api.writeScript(p.id)}><${Icon} n="redo" />Rewrite to ${lenLabel(target)}</button>`}
    </${StepHead}>
    <div className="script-grid">
      <div className="stack">
        ${sc.picturing ? html`<div className="row note"><span className="spinner"></span> Writing an image idea for each sentence</div>` : null}
        ${sc.hook_options.length > 1 ? html`<section className="panel stack">
          <div className="panel-h" style=${{ marginBottom: 0 }}><h2>Opening hook</h2><span className="note">Pick one of three. It becomes the first ${isChar ? 'line' : 'paragraph'}.</span></div>
          <div className="hooks">${sc.hook_options.map((h, i) => html`<button key=${i} type="button" className="hookopt" aria-pressed=${sc.chosen_hook === i} disabled=${locked} onClick=${() => pickHook(i)}><span className="radio"></span><span>${h}</span></button>`)}</div>

        <section className="panel stack">
          <div className="panel-h" style=${{ marginBottom: 0 }}><h2>The story</h2><span className="note mono">${words(sc.story).length} words · about ${fmtT(total)} of ${fmtT(target)}</span></div>
          <div className=${'meter' + (Math.abs(total - target) > target * 0.25 ? ' warn' : '')} aria-hidden="true"><i style=${{ width: Math.min(100, total / target * 100) + '%' }}></i></div>
          <label htmlFor="story" className="note">${isChar ? 'One line per speaker, written as Name: what they say. Characters: ' + p.characters.map(c => c.name).join(', ') + '.' : 'Write it the way it will be narrated, as one continuous story.'}</label>

          <div className="row">
            <button type="button" className="btn primary" disabled=${locked || sc.revising || !idea.trim()} onClick=${async () => { if (await api.reviseStory(p.id, idea)) setIdea(''); }}>${sc.revising ? html`<span className="spinner"></span> Rewriting` : html`<${Fragment}><${Icon} n="spark" />Rewrite with this idea</${Fragment}>`}</button>
            ${sc.prev_story && !locked ? html`<button type="button" className="btn ghost" onClick=${() => updateP(p.id, q => { const t = q.script.story; q.script.story = q.script.prev_story; q.script.prev_story = t; q.script.changed = 'Back to the version before the last rewrite.'; })}><${Icon} n="redo" />Undo last rewrite</button>` : null}
          </div>
          ${sc.changed ? html`<p className="okbox">${sc.changed}</p>` : null}
        </section>
      </div>
      <div className="stack">
        ${p.source.transcript ? html`<section className="panel stack">
          <h3>Originality check</h3>
          <div className=${'meter ' + (ovPct > 25 ? 'bad' : ovPct > 10 ? 'warn' : '')}><i style=${{ width: Math.max(3, Math.min(100, ovPct * 2)) + '%' }}></i></div>
          ${ovPct > 25 ? html`<div className="warnbox">${ovPct}% of phrases match the source transcript. Reword those parts so the story is your own.</div>` : html`<div className="okbox">${ovPct}% phrase overlap with the source. Wording is original.</div>`}
          <p className="note">Compares three-word phrases against the reference transcript.</p>
        </section>` : null}
        <section className="panel stack">
          <h3>Story at a glance</h3>
          <dl className="kv" style=${{ gridTemplateColumns: '1fr auto' }}><dt>Words</dt><dd className="mono">${words(sc.story).length}</dd><dt>Sentences</dt><dd className="mono">${lines.length}</dd><dt>Spoken length</dt><dd className="mono">${fmtT(total)}</dd></dl>

        <section className="panel stack">
          <h3>Style guide applied</h3>

        <section className="panel stack"><h3>Written from</h3>${sc.written_with.map(id => { const a = p.angles.find(x => x.id === id); return a ? html`<div key=${id} style=${{ fontSize: 13 }}><span className="eyebrow">${a.type}</span><div>${a.title}</div></div>` : null; })}</section>
      </div>
    </div>
    <${ApproveBar} p=${p} step="script" ready=${lines.length > 0 && !sc.revising && !sc.picturing} hint=${sc.revising ? 'Wait for the rewrite to finish.' : sc.picturing ? 'Wait for the image ideas to finish.' : 'Write the story first.'} label="Approve story" onApprove=${onApprove} />
  </${Fragment}>`;
}

/* ======================================================================

function StyleScreen({ p, s }) {

  const pick = id => !locked && updateP(p.id, q => { q.style = id; });
  const addFiles = async list => {
    const out = [];
    for (const f of Array.from(list).slice(0, 3)) { try { out.push(await readImage(f)); } catch (e) { toast('“' + f.name + '” could not be read as an image.'); } }
    setFiles(out.slice(0, 3));
  };
  const create = async () => {
    setBusy(true);
    try {
      const r = LIVE ? await post('style-from-images', { images: files, name }) : (await sleep(900), { name: name || 'My style', mood: 'Your own look', prefix: 'in the visual style of the reference images: same medium, palette, lighting and texture', avoid: 'anything that breaks the reference look', palette: ['#2B2B2B', '#7A6F63', '#EFE8DE', '#C47A4A'], cost: 0 });
      const id = uid('custom');
      update(x => { x.customStyles = (x.customStyles || []).concat({ id, name: r.name, kind: 'soft', mood: r.mood, best: 'Your own channel look', prefix: r.prefix, avoid: r.avoid, palette: r.palette, refs: files.slice(), custom: true }); });
      updateP(p.id, q => { q.style = id; addCost(q, r.cost || 0); });
      setFiles([]); setName(''); toast('Template “' + r.name + '” created and selected.');
    } catch (e) { toast(e.message); }
    setBusy(false);
  };
  return html`<${Fragment}>
    <${StepHead} title="Visual style" sub="Choose the frame and the look. Both are used for every scene image, so they are set here, before any image is made." />
    <section className="panel stack">
      <div className="panel-h" style=${{ marginBottom: 0 }}><h2>Frame</h2><span className="note">Where the video will be posted</span></div>
      <div className="frames" role="radiogroup" aria-label="Frame">${FRAMES.map(f => html`<button key=${f.v} type="button" className="aspect" role="radio" aria-checked=${p.format.aspect_ratio === f.v} aria-pressed=${p.format.aspect_ratio === f.v} disabled=${locked} onClick=${() => updateP(p.id, q => { q.format.aspect_ratio = f.v; })}>
        <i style=${{ width: f.w, height: f.h }}></i><strong className="mono">${f.v}</strong><span>${f.name}</span><span className="note">${f.use}</span>
      </button>`)}</div>
    </section>
    <section className="panel stack">
      <div className="panel-h" style=${{ marginBottom: 0 }}><h2>Look</h2><span className="note">${allStyles().length} templates. Each one is shown on the same four scenes so you can compare.</span></div>
      <div className="tgal" role="radiogroup" aria-label="Visual template">${allStyles().map(t => html`<button key=${t.id} type="button" className="tcard" role="radio" aria-checked=${cur === t.id} aria-pressed=${cur === t.id} disabled=${locked} onClick=${() => pick(t.id)}>
        <div className="tmain">${styleImg(t, 1) ? html`<img src=${styleImg(t, 1)} alt=${t.name + ' example'} loading="lazy" />` : html`<${Art} seed=${hashSeed(t.id)} styleId=${t.id} />`}</div>
        <div className="tthumbs">${[2, 3, 4].map(n => html`<span key=${n}>${styleImg(t, n) ? html`<img src=${styleImg(t, n)} alt="" loading="lazy" />` : null}</span>`)}</div>
        <div className="tbody"><div className="row" style=${{ justifyContent: 'space-between', gap: 4 }}><strong>${t.name}</strong>${t.id === suggested ? html`<span className="chip">Suggested</span>` : t.custom ? html`<span className="chip">Yours</span>` : null}</div>
          <span className="note">${t.mood}</span><span className="note">Best for: ${t.best}</span></div>
        ${cur === t.id ? html`<span className="tcheck"><${Icon} n="check" /></span>` : null}
      </button>`)}</div>
    </section>
    <section className="panel stack">
      <div className="tdetail">
        ${styleImg(st, 1) ? html`<img src=${styleImg(st, 1)} alt=${st.name} />` : html`<div className="frame r1x1"><${Art} seed=${hashSeed(st.id)} styleId=${st.id} /></div>`}

          ${st.custom ? html`<div className="row"><span className="note">Your reference images are sent with every scene image.</span><button type="button" className="btn sm ghost danger" disabled=${locked} onClick=${() => { update(x => { x.customStyles = (x.customStyles || []).filter(c => c.id !== st.id); }); updateP(p.id, q => { q.style = 'photoreal'; }); }}><${Icon} n="trash" />Delete template</button></div>` : null}

    <${ApproveBar} p=${p} step="style" ready=${!!cur} label=${'Approve ' + st.name} onApprove=${() => { updateP(p.id, q => { q.style = cur; }); approve(p.id, 'style'); }} />
  </${Fragment}>`;
}
function hashSeed(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) % 100000; }
function applyTemplate(pid, t) { updateP(pid, q => { q.style = t.style; q.audio.voice_id = t.voice_id; q.audio.caption_style = t.caption_style; q.audio.music_path = t.music; q.format.aspect_ratio = t.aspect; q.template_id = t.id; }); }

/* ======================================================================
   5. Voice (AUD-1..4, CHR-1..4)

function speak(text, v) {
  try { const synth = window.speechSynthesis; if (!synth) return false; synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.pitch = Math.min(2, v.pitch); u.rate = v.rate; synth.speak(u); return true; } catch (e) { return false; }
}
const previewCache = {};
function PreviewBtn({ text, voice }) {
  const [on, setOn] = useState(false);
  const play = async e => {
    e.stopPropagation(); setOn(true);
    if (LIVE && !voice.clone) {
      const p = STATE.projects[STATE.currentId]; const key = voice.id + '|' + p.models.voice + '|' + text;
      try { previewCache[key] = previewCache[key] || await post('tts', { text, voice: voice.id, model: p.models.voice, delivery: p.audio.delivery || DEFAULT_DELIVERY }); new Audio(previewCache[key].url).play(); }
      catch (err) { toast(err.message); }
    } else speak(text, voice);
    setTimeout(() => setOn(false), 2500);
  };
  return html`<button type="button" className="btn sm" onClick=${play}><${Icon} n=${on ? 'speaker' : 'play'} />${on ? 'Playing' : 'Preview'}</button>`;
}

  return html`<${Fragment}>
    <${StepHead} title=${isChar ? 'Characters and voices' : 'Voice'} sub=${isChar ? 'Give each character a look and a voice. Each dialogue line is spoken in its character’s voice.' : 'Preview a voice on the first line, then generate the narration. Audio length sets each scene’s length.'} />

        <div className="stack" style=${{ gap: 6 }}><div className="art"><${Art} seed=${c.seed} styleId=${p.style} title=${c.name + ' reference'} /></div><button type="button" className="btn sm" disabled=${locked} onClick=${() => updateP(p.id, q => { q.characters.find(x => x.id === c.id).seed = randSeed(); addCost(q, modelOf(q, 'image').cost); })}><${Icon} n="redo" />New look</button></div>

    <section className="panel stack">

    </section>
    <${ApproveBar} p=${p} step="voice" ready=${allReady} hint="Generate audio for every line first." label="Approve voice" onApprove=${() => approve(p.id, 'voice')} />
  </${Fragment}>`;

/* ======================================================================

}

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 640 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

}

function ClipPreview({ p, sc }) {

  return html`<div className=${'frame' + frameCls(p)}>
    <div className="stage-wrap" style=${{ transform: tr }}>${v ? html`<${Art} seed=${v.seed} styleId=${v.style || p.style} upload=${v.upload || v.url} />` : null}</div>
    ${c ? html`<span className="badge">Take ${sc.clip_index + 1}</span>` : null}
    ${sc.clip_status === 'generating' ? html`<div className="overlay"><span className="spinner"></span>Animating</div>` : null}
    ${sc.clip_status === 'failed' ? html`<div className="overlay"><span>Failed</span><button type="button" className="btn sm" onClick=${() => api.animate(p.id, [sc.id])}>Retry</button></div>` : null}
    ${!c && sc.clip_status === 'pending' ? html`<div className="overlay">Still image</div>` : null}
  </div>`;
}
function AnimateScreen({ p, s }) {

        ${sc.clip_versions.length > 1 ? html`<div className="row" style=${{ gap: 4 }}>${sc.clip_versions.map((v, k) => html`<button key=${k} type="button" className="chip btnchip" aria-pressed=${k === sc.clip_index} onClick=${() => setS(sc.id, x => { x.clip_index = k; })}>Take ${k + 1}</button>`)}</div>` : null}
      </div>

          <button type="button" className="btn sm" disabled=${locked || sc.clip_status === 'generating' || sc.clip_status === 'pending'} onClick=${() => api.animate(p.id, [sc.id])}><${Icon} n="redo" />New take <span className="tag">${fmt$(genSecs(sc) * vm.cost)}</span></button></div>

        ${c ? html`<p className="note mono">Generated ${c.generated}s → ${c.fitted < c.generated ? 'trimmed' : 'extended'} to ${c.fitted.toFixed(1)}s to match audio</p>` : null}
        <div className="row"><button type="button" className="btn sm ghost" disabled=${locked} onClick=${() => setS(sc.id, x => { x.animate = false; })}>Make this scene static</button></div>

/* ======================================================================
   Player: draft and final preview (ASM-1, ASM-2, ASM-4)
   ====================================================================== */
function Player({ p, mode }) {
  const scenes = p.scenes; const durs = scenes.map(sc => sceneSecs(p, sc)); const total = durs.reduce((a, b) => a + b, 0) || 1;
  const [t, setT] = useState(0); const [playing, setPlaying] = useState(false);
  useEffect(() => {
    if (!playing) return; let last = performance.now(), raf;
    const tick = now => { const dt = (now - last) / 1000; last = now; setT(x => { const n = x + dt; if (n >= total) { setPlaying(false); return total; } return n; }); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [playing, total]);
  let acc = 0, idx = 0; for (let i = 0; i < durs.length; i++) { if (t < acc + durs[i] || i === durs.length - 1) { idx = i; break; } acc += durs[i]; }
  const sc = scenes[idx]; if (!sc) return null;
  const local = Math.min(1, Math.max(0, (t - acc) / durs[idx]));
  const v = sceneVersion(p, sc);
  const clip = sc.animate && sc.clip_versions[sc.clip_index];
  const dir = idx % 2 ? -1 : 1;
  const tr = clip
    ? 'scale(' + (1.1 + 0.08 * local) + ') translate(' + (Math.sin(local * 6.28) * 2.5) + '%, ' + (Math.cos(local * 6.28) * 2) + '%) rotate(' + Math.sin(local * 6.28) * 1 + 'deg)'
    : 'scale(' + (1.05 + 0.12 * local) + ') translate(' + (dir * (local - 0.5) * 5) + '%, ' + ((0.5 - local) * 2) + '%)';
  const ls = sceneLines(p, sc); const text = captionOf(p, sc); const ws = words(text); const wi = Math.min(ws.length - 1, Math.floor(local * ws.length));
  const cap = p.audio.caption_style;
  const speaker = p.video_type === 'character' && ls[0] && p.characters.find(c => c.id === ls[0].speaker);
  const h = p.format.aspect_ratio === '16:9';
  let caption = null;
  if (cap === 'none') caption = null;
  else if (cap === 'bold') { const start = Math.floor(wi / 3) * 3; caption = html`<div className="caption bold">${ws.slice(start, start + 3).map((w, k) => html`<span key=${k} className=${start + k === wi ? 'on' : ''}>${w}</span>`)}</div>`; }
  else if (cap === 'clean') caption = html`<div className="caption clean">${text}</div>`;
  else caption = html`<div className="caption karaoke">${ws.map((w, k) => html`<span key=${k} className=${k <= wi ? 'past' : ''}>${w + ' '}</span>`)}</div>`;
  const music = MUSIC.find(m => m.id === p.audio.music_path);
  return html`<div className=${'player' + frameCls(p)}>
    <div className=${'frame' + frameCls(p)} style=${{ borderRadius: 14 }}>
      <div className="stage-wrap" style=${{ transform: tr }}>${v ? html`<${Art} seed=${v.seed} styleId=${v.style || p.style} upload=${v.upload || v.url} />` : null}</div>
      ${t > 0 || playing ? caption : null}
      ${speaker ? html`<span className="speaker">${speaker.name}</span>` : null}
      ${mode === 'draft' ? html`<span className="drafttag">DRAFT 480p</span>` : null}
      ${!playing && t === 0 ? html`<button type="button" className="overlay" style=${{ border: 0, cursor: 'pointer' }} onClick=${() => setPlaying(true)} aria-label="Play preview"><span style=${{ width: 54, height: 54, borderRadius: '50%', background: 'rgba(255,255,255,0.92)', color: '#111', display: 'grid', placeItems: 'center' }}><svg viewBox="0 0 20 20" width="22" height="22"><path d="M6 4l10 6-10 6z" fill="currentColor" /></svg></span><span>${fmtT(total)} · ${scenes.length} scenes</span></button>` : null}
    </div>
    <div className="controls">
      <button type="button" className="btn sm" aria-label=${playing ? 'Pause' : 'Play'} onClick=${() => { if (t >= total) setT(0); setPlaying(!playing); }}><${Icon} n=${playing ? 'pause' : 'play'} /></button>
      <input type="range" min="0" max=${total} step="0.05" value=${t} aria-label="Scrub" onChange=${e => { setT(+e.target.value); }} />
      <span className="mono muted" style=${{ fontSize: 12 }}>${fmtT(t)}/${fmtT(total)}</span>
    </div>
    <div className="note" style=${{ fontSize: 12 }}>Scene ${idx + 1} of ${scenes.length} · ${clip ? 'animated clip' : 'zoom and pan'}${music && music.id !== 'none' ? ' · music: ' + music.name + ' ' + Math.round(p.audio.music_volume * 100) + '%' + (p.audio.duck ? ', ducked' : '') : ''}</div>
  </div>`;
}

      <div className="stack">
        <div className="filecard"><span className="fileicon">MP4</span><div className="grow" style=${{ minWidth: 0 }}><div className="mono" style=${{ fontSize: 13, overflowWrap: 'anywhere' }}>${fname}</div><div className="note mono">${p.format.aspect_ratio} · 1080p · H.264 · ${fmtT(secs)} · ~${Math.round(secs * 0.7)} MB</div></div>
          ${LIVE && p.render.final_path ? html`<a className="btn primary" href=${p.render.final_path} download=${fname}><${Icon} n="download" />Download</a>` : html`<button type="button" className="btn primary" disabled title="In this preview no real file is rendered. Downloads work once the backend is connected."><${Icon} n="download" />Download</button>`}</div>
        <p className="note">${LIVE ? 'Rendered on your server with FFmpeg. The file stays in the server\u2019s data/media/renders folder.' : 'This preview renders no real file. Once the backend is connected, Download saves the MP4 and the project folder keeps it.'}</p>
        ${LIVE && (p.render.final_srt) ? html`<div className="row"><a className="btn" href=${p.render.final_srt} download=${fname.replace('.mp4', '.srt')}><${Icon} n="download" />Captions file (.srt)</a><span className="note">For uploading captions separately.</span></div>` : null}
      </div>
    </div>
    <${PublishKit} p=${p} />
    <${ChannelKit} p=${p} />
    <section className="panel row">
      <label className="switch grow"><input id="disclose" type="checkbox" checked=${disclose} onChange=${e => setDisclose(e.target.checked)} />Remind me to tick the platform’s “altered or synthetic content” box when uploading</label>
      <button type="button" className="btn" onClick=${() => { update(st => { st.templates.push({ id: uid('tpl'), name: p.title + ' look', style: p.style, voice_id: p.audio.voice_id, caption_style: p.audio.caption_style, music: p.audio.music_path, aspect: p.format.aspect_ratio, tone: 'Friendly, practical, no filler', pacing: 'A new visual every 3 to 4 seconds' }); }); toast('Saved this look as a template.'); }}><${Icon} n="layers" />Save this look as a template</button>
      <button type="button" className="btn primary" onClick=${() => update(st => { st.view = 'ideas'; })}>Next video from the idea bank</button>
    </section>
  </${Fragment}>`;
}

/* ======================================================================
   Library views: projects, idea bank, templates, settings
   ====================================================================== */
function openProject(id) { update(s => { s.currentId = id; s.view = 'flow'; }); }
function ProjectsView({ s }) {
  const list = Object.values(s.projects).sort((a, b) => b.updated_at - a.updated_at);
  const create = () => { const p = newProject(); update(st => { st.projects[p.id] = p; st.currentId = p.id; st.view = 'flow'; }); };
  return html`<${Fragment}>
    <${StepHead} title="Projects" sub="Every video is a project saved on its own. Close the app any time and pick up where you left off."><button type="button" className="btn primary" onClick=${create}><${Icon} n="plus" />New project</button></${StepHead}>
    <div className="list">${list.map(p => { const done = STEPS.filter(st => isDone(p, st.id)).length; const st = STEPS.find(x => x.id === p.step); return html`<div key=${p.id} className="lrow">
      <div className="grow" style=${{ minWidth: 0 }}><strong>${p.title}</strong><div className="note">${p.video_type === 'character' ? 'Character video' : 'Voiceover video'} · at ${st.label} · ${done} of ${STEPS.length} steps · spent ${fmt$(p.render.cost_actual)}</div></div>
      ${p.status === 'rendered' ? html`<span className="pill ready">Rendered</span>` : html`<span className="pill pending">In progress</span>`}
      <button type="button" className="btn" onClick=${() => openProject(p.id)}>${p.id === s.currentId ? 'Continue' : 'Open'}</button>
      ${Object.keys(s.projects).length > 1 ? html`<button type="button" className="btn ghost sm danger" aria-label="Delete project" onClick=${() => update(x => { delete x.projects[p.id]; if (x.currentId === p.id) x.currentId = Object.keys(x.projects)[0]; })}><${Icon} n="trash" /></button>` : null}
    </div>`; })}</div>
  </${Fragment}>`;
}
function IdeasView({ s }) {
  const start = idea => {
    const src = s.projects[idea.pid]; const p = newProject(idea.angle.title);
    if (src) { p.source = clone(src.source); p.analysis = clone(src.analysis); p.angles = clone(src.angles); p.ingest_url = src.ingest_url; }
    else { p.source = { ...clone(SAMPLE.source), url: '' }; p.analysis = clone(SAMPLE.analysis); p.angles = clone(SAMPLE.angles); }
    p.selected_angle_ids = [idea.angle.id]; p.style = idea.angle.style; p.video_type = idea.angle.character ? 'character' : 'voiceover'; p.step = 'angles';
    update(st => { st.projects[p.id] = p; st.currentId = p.id; st.view = 'flow'; });
    toast('New project started from “' + idea.angle.title + '”. Approve the angle to write its script.');
  };
  return html`<${Fragment}>
    <${StepHead} title="Idea bank" sub="Angles you saved for later, with the reference video they came from." />
    ${s.ideaBank.length ? html`<div className="list">${s.ideaBank.map(i => html`<div key=${i.id} className="lrow">
      <${Score} v=${i.angle.score} />
      <div className="grow" style=${{ minWidth: 0 }}><span className="eyebrow">${i.angle.type}</span><div><strong>${i.angle.title}</strong></div><div className="note">From “${i.source}”</div></div>
      <button type="button" className="btn ghost sm" onClick=${() => update(st => { st.ideaBank = st.ideaBank.filter(x => x.id !== i.id); const p = st.projects[i.pid]; const a = p && p.angles.find(x => x.id === i.angle.id); if (a) a.saved = false; })}>Remove</button>
      <button type="button" className="btn primary" onClick=${() => start(i)}>Start a video</button>
    </div>`)}</div>` : html`<div className="panel stack" style=${{ alignItems: 'flex-start' }}><strong>No saved angles yet</strong><p className="note">On the Pick angle step, press “Save for later” on any card. It shows up here so you can turn it into its own video.</p><button type="button" className="btn" onClick=${() => goStep('angles')}>Go to angles</button></div>`}
  </${Fragment}>`;
}
function TemplatesView({ s }) {
  const p = s.projects[s.currentId]; const locked = p.checkpoints.style;
  const [open, setOpen] = useState(p.style || 'photoreal'); const st = styleById(open);
  const use = id => { if (locked) return; updateP(p.id, q => { q.style = id; }); toast('“' + styleById(id).name + '” is now the look for “' + p.title + '”.'); };
  return html`<${Fragment}>
    <${StepHead} title="Templates" sub="Visual templates set the look of every scene image. Channel looks save a whole setup: style, voice, captions, music and frame." />
    <section className="panel stack">
      <div className="panel-h" style=${{ marginBottom: 0 }}><h2>Visual templates</h2><span className="note">${allStyles().length} templates, each shown on the same four scenes. Click one to see its recipe.</span></div>
      <div className="tgal">${allStyles().map(t => html`<button key=${t.id} type="button" className="tcard" aria-pressed=${open === t.id} onClick=${() => setOpen(t.id)}>
        <div className="tmain">${styleImg(t, 1) ? html`<img src=${styleImg(t, 1)} alt=${t.name + ' example'} loading="lazy" />` : html`<${Art} seed=${hashSeed(t.id)} styleId=${t.id} />`}</div>
        <div className="tthumbs">${[2, 3, 4].map(n => html`<span key=${n}>${styleImg(t, n) ? html`<img src=${styleImg(t, n)} alt="" loading="lazy" />` : null}</span>`)}</div>
        <div className="tbody"><div className="row" style=${{ justifyContent: 'space-between', gap: 4 }}><strong>${t.name}</strong>${p.style === t.id ? html`<span className="chip">In use</span>` : t.custom ? html`<span className="chip">Yours</span>` : null}</div>
          <span className="note">${t.mood}</span><span className="note">Best for: ${t.best}</span></div>
      </button>`)}</div>
    </section>
    <section className="panel stack">
      <div className="tdetail">
        ${styleImg(st, 1) ? html`<img src=${styleImg(st, 1)} alt=${st.name} />` : html`<div className="frame r1x1"><${Art} seed=${hashSeed(st.id)} styleId=${st.id} /></div>`}
        <div className="stack" style=${{ gap: 8, minWidth: 0 }}>
          <div className="row" style=${{ justifyContent: 'space-between' }}><h2>${st.name}</h2><span className="swatches">${st.palette.map(c => html`<i key=${c} style=${{ background: c, width: 16, height: 16 }} />`)}</span></div>
          <p className="note">${st.mood}. Best for: ${st.best}.</p>
          <div><div className="eyebrow">Recipe added to every scene image</div><p className="prompt" style=${{ fontSize: 12.5, marginTop: 2 }}>${st.prefix}</p></div>
          <div><div className="eyebrow">Kept out</div><p className="note">${st.avoid}</p></div>
          <div className="row">
            <button type="button" className="btn primary" disabled=${locked || p.style === st.id} onClick=${() => use(st.id)}>${p.style === st.id ? 'In use for “' + p.title + '”' : 'Use for “' + p.title + '”'}</button>
            ${locked ? html`<span className="note">This project’s style is approved. Reopen its Visual style step to change it.</span>` : null}
            <button type="button" className="btn ghost" onClick=${() => goStep(isUnlocked(p, 'style') ? 'style' : p.step)}>Create your own on the Visual style step</button>
          </div>
        </div>
      </div>
    </section>
    <section className="panel stack">
      <div className="panel-h" style=${{ marginBottom: 0 }}><h2>Channel looks</h2><span className="note">Save one from the Export step after a video you like</span></div>
      <div className="list">${s.templates.map(t => html`<div key=${t.id} className="lrow">
        <div style=${{ width: 64, flex: 'none' }}><div className="thumb" style=${{ aspectRatio: '1' }}>${styleImg(styleById(t.style), 1) ? html`<img src=${styleImg(styleById(t.style), 1)} alt="" style=${{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />` : html`<${Art} seed=${hashSeed(t.style)} styleId=${t.style} />`}</div></div>
        <div className="grow" style=${{ minWidth: 0 }}><strong>${t.name}</strong><div className="note">${styleById(t.style).name} · voice ${voiceById(t.voice_id).name} · ${CAPTIONS.find(c => c.id === t.caption_style).name} captions · ${MUSIC.find(m => m.id === t.music).name} · ${t.aspect}</div><div className="note">Tone: ${t.tone}. Pacing: ${t.pacing}.</div></div>
        <button type="button" className="btn" disabled=${locked} title=${locked ? 'Reopen the Visual style step to apply a channel look' : ''} onClick=${() => { applyTemplate(p.id, t); toast('Applied to “' + p.title + '”.'); }}>Apply to current project</button>
      </div>`)}</div>
    </section>
  </${Fragment}>`;
}
function SettingsView({ s }) {
  const [confirm, setConfirm] = useState(false);
  const byProv = { google: ANALYSTS.map(a => a.name + ' (video analysis)') }; Object.values(MODELS).flat().forEach(m => { (byProv[m.provider] = byProv[m.provider] || []).push(m.name); });
  return html`<${Fragment}>
    <${StepHead} title="Settings" sub="Providers, default models and cost limits. API keys live in the server’s environment variables and never reach the browser." />
    <section className="panel stack"><h2>Providers</h2>
      <p className="note">Gemini watches the video and writes the breakdown; the writing model (ChatGPT for now, Claude once its key is added) turns that report into angles and the story. Model selectors only list providers with a key. In this demo, toggle a key to see the selectors change.</p>
      <div className="list">${Object.keys(PROVIDERS).map(k => html`<div key=${k} className="lrow" style=${{ padding: '10px 12px' }}>
        <div className="grow" style=${{ minWidth: 0 }}><strong>${PROVIDERS[k]}</strong><div className="note">${byProv[k] ? Array.from(new Set(byProv[k])).join(', ') : PROVIDER_USE[k]}</div><div className="mono note" style=${{ fontSize: 11 }}>${PROVIDER_ENV[k]}</div></div>
        <label className="switch"><input id=${'key-' + k} type="checkbox" checked=${s.settings.keys[k]} disabled=${!!LIVE} onChange=${e => update(st => { st.settings.keys[k] = e.target.checked; })} />${s.settings.keys[k] ? 'Key present' : 'No key'}</label>
      </div>`)}</div>
    </section>
    <section className="panel stack"><h2>Defaults for new projects</h2>
      <div className="fmt-grid">
        <label className="field">Video analysis (watches the video)<select id="analyst" className="select" value=${s.settings.analyst} onChange=${e => update(st => { st.settings.analyst = e.target.value; })}>${ANALYSTS.map(a => html`<option key=${a.id} value=${a.id}>${a.name} \u00b7 ${a.limits}</option>`)}</select></label>
        ${['writer', 'voice', 'image', 'video'].map(kind => html`<label key=${kind} className="field">${KIND_LABEL[kind]} model<select className="select" value=${s.settings.defaults[kind]} onChange=${e => update(st => { st.settings.defaults[kind] = e.target.value; })}>${MODELS[kind].filter(m => s.settings.keys[m.provider]).map(m => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}</select></label>`)}</div>
    </section>
    <section className="panel stack"><h2>Most images per video</h2>
      <label className="field" htmlFor="image-cap">The Scenes page will not generate more scene images than this for one video<input id="image-cap" className="input mono" type="number" min="5" max="400" style=${{ width: 100 }} value=${s.settings.imageCap || 60} onChange=${e => update(st => { st.settings.imageCap = Math.max(5, Math.min(400, +e.target.value || 60)); })} /></label>
    </section>
    <section className="panel stack"><h2>Cost limit</h2>
      <label className="field" htmlFor="limit">Ask before a project spends more than<div className="row"><span className="mono">$</span><input id="limit" className="input mono" type="number" min="0.1" step="0.1" style=${{ width: 100 }} value=${s.settings.costLimit} onChange=${e => update(st => { st.settings.costLimit = Math.max(0.1, +e.target.value || 1); })} /></div></label>
    </section>
    <section className="panel stack"><h2>Demo data</h2>
      <p className="note">Everything here is stored in this browser only. Resetting brings back the sample project at the Pick angle step.</p>
      ${confirm ? html`<div className="row"><span>Delete all projects, ideas and templates in this demo?</span><button type="button" className="btn danger" onClick=${() => { STATE = seed(); persist(); listeners.forEach(l => l()); setConfirm(false); }}>Reset demo</button><button type="button" className="btn ghost" onClick=${() => setConfirm(false)}>Cancel</button></div>` : html`<div><button type="button" className="btn" onClick=${() => setConfirm(true)}>Reset demo data</button></div>`}
    </section>
  </${Fragment}>`;
}

/* ======================================================================
   Jobs drawer and toasts
   ====================================================================== */
function Jobs({ s }) {
  const [open, setOpen] = useState(false);
  const running = s.jobs.filter(j => j.status === 'running');
  const genImgs = Object.values(s.projects).reduce((n, p) => n + p.scenes.filter(x => x.image_status === 'generating' || x.clip_status === 'generating').length, 0);
  const busy = running.length + genImgs;
  return html`<div className="jobs-btn">
    ${open ? html`<div className="jobs-panel" role="dialog" aria-label="Job queue">
      <div className="row" style=${{ justifyContent: 'space-between' }}><strong>Job queue</strong><button type="button" className="btn ghost sm" aria-label="Close" onClick=${() => setOpen(false)}><${Icon} n="x" /></button></div>
      ${genImgs ? html`<div className="job"><div className="row"><span className="spinner" style=${{ color: 'var(--rec)' }}></span>${genImgs} scene ${genImgs > 1 ? 'items' : 'item'} generating</div></div>` : null}
      ${s.jobs.length ? s.jobs.map(j => html`<div key=${j.id} className="job"><div className="row" style=${{ justifyContent: 'space-between' }}><span>${j.label}</span>${j.status === 'running' ? html`<span className="pill generating">Running</span>` : j.status === 'failed' ? html`<span className="pill failed">Failed</span>` : html`<span className="pill ready">Done</span>`}</div>
        <div className="meter"><i style=${{ width: (j.stage / j.stages.length * 100) + '%' }}></i></div>
        <span className="note">${j.status === 'running' ? j.stages[j.stage] : 'Finished'}</span></div>`) : (!genImgs ? html`<p className="note">Slow work like analysis, voice, images and rendering runs here in the background. Nothing has run yet this session.</p>` : null)}
    </div>` : null}
    <button type="button" className="btn" onClick=${() => setOpen(!open)} aria-expanded=${open}>${busy ? html`<span className="spinner" style=${{ color: 'var(--rec)' }}></span>` : html`<${Icon} n="layers" />`}Jobs${busy ? ' · ' + busy + ' running' : ''}</button>
  </div>`;
}
function Toasts({ s }) { return html`<div className="toasts" aria-live="polite">${s.toasts.map(t => html`<div key=${t.id} className="toast">${t.msg}</div>`)}</div>`; }

/* ======================================================================
   App
   ====================================================================== */
function Flow({ p, s }) {
  let step = p.step;
  if (!isUnlocked(p, step) || isSkipped(p, step)) step = STEPS.slice().reverse().find(st => isUnlocked(p, st.id) && !isSkipped(p, st.id)).id;
  const Screen = { ingest: IngestScreen, angles: AnglesScreen, script: ScriptScreen, style: StyleScreen, voice: VoiceScreen, format: FormatScreen, scenes: ScenesScreen, animate: AnimateScreen, compile: CompileScreen, export: ExportScreen }[step];
  return html`<${Screen} p=${p} s=${s} />`;
}
function App() {
  const s = useStore(); const p = s.projects[s.currentId];
  const View = { flow: Flow, projects: ProjectsView, ideas: IdeasView, templates: TemplatesView, settings: SettingsView }[s.view] || Flow;
  return html`<div className="app">
    <${TopBar} s=${s} p=${p} />
    <div className="shell"><${Rail} s=${s} p=${p} /><main className="main"><${View} p=${p} s=${s} /></main></div>
    <${Toasts} s=${s} />
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
detectLive();
</script>

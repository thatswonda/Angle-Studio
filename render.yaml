# Render blueprint: New > Blueprint, pick this repo, then fill in the secret values when asked.
services:
  - type: web
    name: angle-studio
    runtime: docker
    plan: starter            # always on; the free plan sleeps and loses rendered files on restart
    healthCheckPath: /healthz
    disk:                    # keeps voice clips, images and videos when the app redeploys or restarts
      name: angle-studio-data
      mountPath: /app/server/data
      sizeGB: 5
    envVars:
      - key: APP_PASSWORD    # the password the browser asks for; keeps strangers off your API keys
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FAL_KEY         # fal.ai key for the FLUX schnell and dev image models
        sync: false
      - key: ANTHROPIC_API_KEY  # Claude writes angles, scripts, image ideas, titles and channel ideas
        sync: false
      - key: ANGLE_STUDIO_WRITER
        value: claude-opus-5-5
      - key: ANGLE_STUDIO_MOCK
        value: "0"
